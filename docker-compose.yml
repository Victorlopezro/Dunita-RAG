version: "3.9"

# ─────────────────────────────────────────────────────────────
# rag-rack — Docker Compose
#
# Servicios:
#   qdrant    → Base vectorial (puerto 6333)
#   ollama    → Runtime del LLM Qwen (puerto 11434)
#   api       → FastAPI backend (puerto 8000)
#   frontend  → Streamlit chatbot (puerto 8501)
#
# Uso:
#   docker compose up -d
#   docker compose logs -f api
# ─────────────────────────────────────────────────────────────

services:

  # ── Qdrant — Base vectorial ──────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: rag_rack_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"   # gRPC (opcional)
    volumes:
      - ./volumes/qdrant:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Ollama — Runtime del LLM ─────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: rag_rack_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./volumes/ollama:/root/.ollama
    # Descomentar si tienes GPU NVIDIA:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── API — FastAPI backend ────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: rag_rack_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      QDRANT_HOST: qdrant
      OLLAMA_HOST: ollama
      PYTHONPATH: /app
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Frontend — Streamlit chatbot ─────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rag_rack_frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      FRONTEND_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy

# ─────────────────────────────────────────────────────────────
# Redes
# ─────────────────────────────────────────────────────────────
networks:
  default:
    name: rag_rack_network
